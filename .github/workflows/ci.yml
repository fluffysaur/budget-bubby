name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rls: ${{ steps.filter.outputs.rls }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rls:
              - 'supabase/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'src/**'
              - 'e2e/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'playwright.config.ts'
              - 'vite.config.ts'
              - '.github/workflows/ci.yml'

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

  e2e:
    name: e2e
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official image ships Chromium, WebKit and their system libraries, so
    # there is no apt download at job time. Keep the tag in step with the
    # @playwright/test version in pnpm-lock.yaml (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.65.1
    steps:
      - uses: actions/checkout@v4

      - name: Check Playwright image matches lockfile
        run: |
          locked=$(grep -m1 -oE "'@playwright/test@[0-9.]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$locked" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "pnpm-lock.yaml has @playwright/test $locked but the e2e image is $PLAYWRIGHT_IMAGE_VERSION; update the image tag and PLAYWRIGHT_IMAGE_VERSION in ci.yml"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright e2e tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rls:
    name: rls
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned on purpose: a floating CLI can change migration/test behaviour
      # under us. Bump deliberately, in its own PR.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # Some older migrations use a date-only version (YYYYMMDD_name.sql) and two
      # share 20261029, which the CLI rejects as duplicate versions. Give those
      # unique 14-digit versions in this CI checkout only (not committed).
      - name: Normalise migration versions
        run: |
          i=0
          for f in supabase/migrations/[0-9]*.sql; do
            base=$(basename "$f")
            if [[ "$base" =~ ^([0-9]{8})_(.*)$ ]]; then
              i=$((i + 1))
              mv "$f" "supabase/migrations/${BASH_REMATCH[1]}$(printf '%06d' "$i")_${BASH_REMATCH[2]}"
            fi
          done
          ls supabase/migrations

      - name: Start local Supabase (database only)
        run: supabase start -x storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: RLS isolation tests (pgTAP)
        run: supabase test db

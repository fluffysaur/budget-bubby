<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Squircle clip path ensuring Bubby's torso and resting flipper bleed cleanly to the bottom curve -->
    <clipPath id="squircle-clip">
      <rect x="16" y="16" width="480" height="480" rx="112" />
    </clipPath>
  </defs>

  <!-- Background Squircle (Signature Pastel Lilac) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#dfc2ff" />

  <!-- Character Group clipped to the inner squircle area -->
  <g clip-path="url(#squircle-clip)">
    <!-- Cute Rounded Head Feather Tuft (Reference 2's soft heart-sprout tuft) -->
    <path d="M 254 114
             C 242 84, 216 76, 214 92
             C 212 104, 230 114, 244 120
             Z"
          fill="#2b333c" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 258 114
             C 268 78, 300 72, 300 90
             C 300 104, 282 114, 266 120
             Z"
          fill="#2b333c" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Resting Right Flipper (Tucked cute at the side like Reference 2) -->
    <path d="M 386 334
             C 432 362, 464 406, 452 430
             C 442 450, 408 438, 384 416
             Z"
          fill="#2b333c" stroke="#141414" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Penguin Main Round Chubby Head & Torso Silhouette (Peeking from bottom) -->
    <path d="M 106 520
             C 104 436, 118 368, 128 316
             C 134 282, 130 242, 144 198
             C 164 134, 206 112, 260 112
             C 314 112, 356 134, 376 198
             C 390 242, 386 282, 392 316
             C 402 368, 416 436, 414 520
             Z"
          fill="#2b333c" stroke="#141414" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Glossy Forehead Highlight (Cute jelly-bean shine from Reference 1 & 3) -->
    <ellipse cx="190" cy="154" rx="18" ry="8" transform="rotate(-28 190 154)" fill="#ffffff" opacity="0.88" />
    <circle cx="166" cy="174" r="6" fill="#ffffff" opacity="0.88" />

    <!-- White Face Mask (Deep owl/widow's peak dip into the beak + wide chubby cheeks) -->
    <!-- Plus Connected White Tummy Patch -->
    <path d="M 260 258
             C 246 190, 160 180, 150 256
             C 142 312, 174 342, 168 368
             C 158 412, 146 462, 146 520
             L 374 520
             C 374 462, 362 412, 352 368
             C 346 342, 378 312, 370 256
             C 360 180, 274 190, 260 258
             Z"
          fill="#ffffff" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Seamless Waving Left Flipper (Cleanly joins flipper to shoulder over the body seam) -->
    <path d="M 138 286
             C 100 248, 54 216, 50 244
             C 46 276, 74 344, 130 378"
          fill="#2b333c" stroke="#141414" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Happy ^ ^ Squinting Arc Eyes (Well-spaced from the beak so everything breathes cleanly) -->
    <!-- Left ^ Eye -->
    <path d="M 176 264 Q 197 236 218 264"
          fill="none" stroke="#141414" stroke-width="11.5" stroke-linecap="round" />
    <!-- Right ^ Eye -->
    <path d="M 302 264 Q 323 236 344 264"
          fill="none" stroke="#141414" stroke-width="11.5" stroke-linecap="round" />

    <!-- Soft Rosy Blush Cheeks with Cute Diagonal Blush Marks (from Reference 1 & 3) -->
    <g>
      <ellipse cx="176" cy="296" rx="23" ry="12.5" fill="#f7a8c9" opacity="0.9" />
      <line x1="167" y1="300" x2="172" y2="292" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" />
      <line x1="175" y1="300" x2="180" y2="292" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" />
      <line x1="183" y1="300" x2="188" y2="292" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <g>
      <ellipse cx="344" cy="296" rx="23" ry="12.5" fill="#f7a8c9" opacity="0.9" />
      <line x1="335" y1="300" x2="340" y2="292" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" />
      <line x1="343" y1="300" x2="348" y2="292" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" />
      <line x1="351" y1="300" x2="356" y2="292" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Cute Diamond-Rounded Open Smiling Beak (Reference 2 & 3 style) -->
    <!-- Outer Beak Rim -->
    <path d="M 224 278
             Q 260 254 296 278
             Q 290 322 260 326
             Q 230 322 224 278 Z"
          fill="#f59e42" stroke="#141414" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Smile Mouth Cavity -->
    <path d="M 237 285
             Q 260 294 283 285
             Q 277 314 260 316
             Q 243 314 237 285 Z"
          fill="#9a1b1b" stroke="#141414" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sweet Pink Tongue -->
    <path d="M 246 302
             Q 260 295 274 302
             Q 269 315 260 316
             Q 251 315 246 302 Z"
          fill="#f472b6" />
  </g>

  <!-- Crisp Monoline Ink Squircle Border (drawn on top to frame cleanly) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#141414" stroke-width="12" />
</svg>
